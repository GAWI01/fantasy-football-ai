name: CI

# Every pull request and every push to master runs the same checks a
# contributor runs locally. Merge only when this is green.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, decision engine and model pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/runtime-requirements.txt
            requirements-pipeline.txt
      # The exact versions production runs: the API image installs
      # backend/runtime-requirements.txt and the refresh job
      # requirements-pipeline.txt. Testing unpinned latest versions would test
      # something that is not deployed.
      - run: pip install -r backend/runtime-requirements.txt -r requirements-pipeline.txt pytest httpx
      - name: Tests
        env:
          # Tests never call the real FPL API; keep the upstream limiter out of the way.
          FPL_AI_UPSTREAM_MAX_PER_MINUTE: "1000"
        run: python -m pytest -q
      - name: The API imports with only its runtime dependencies listed
        run: python -c "import backend.main"

  frontend:
    name: Frontend tests, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: pnpm build

  # Dependabot updates merge themselves once both jobs above are green. A red
  # run never reaches this job. Guards: only pull requests Dependabot opened
  # from this repository, only runs Dependabot itself triggered (a human commit
  # on its branch stops it), and only the exact commit CI tested
  # (--match-head-commit). Frontend majors are never proposed (dependabot.yml);
  # Actions majors are, and CI itself runs every action this repository uses.
  # A merge made with the workflow token starts no push run, so CI is started
  # on master explicitly to test the merged result.
  automerge:
    name: Merge green Dependabot update
    needs: [backend, frontend]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$HEAD_SHA"
      - name: Run CI on master
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref master
