# Monthly, grouped dependency updates. CI tests every update PR, and its
# automerge job merges it when CI is green; a red update is never merged.
# A release must be 7 days old before it is proposed (cooldown), so a
# hijacked package version is usually pulled before it can be merged.
#
# No pip updates: backend/runtime-requirements.txt (the API image) and
# requirements-pipeline.txt (the certified forecast pipeline) pin the same
# numpy/pandas/scipy versions and must change together, with the model
# recertified (see docs/MODEL_PIPELINE.md). Dependabot updates one file at a
# time and breaks that.
#
# Frontend major versions (TypeScript, ESLint, Vitest, ...) need code changes,
# so only minor and patch updates are proposed automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
